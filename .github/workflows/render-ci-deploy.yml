name: CI / Build & Trigger Render Deploy

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build backend Docker image
        working-directory: app/backend
        run: |
          docker build -t standor-backend:ci .

      - name: Run backend unit tests (if package.json exists)
        working-directory: app/backend
        run: |
          if [ -f package.json ]; then
            if npm --version >/dev/null 2>&1; then
              npm ci
              if npm run | grep -q "test"; then
                npm test || true
              fi
            fi
          else
            echo "No package.json found; skipping npm test"
          fi

      - name: Trigger Render deploy (optional)
        if: github.event_name == 'push' && env.RENDER_API_KEY && env.RENDER_SERVICE_ID
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          echo "Triggering Render deploy for service $RENDER_SERVICE_ID"
          curl -s -X POST https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -d '{}'
